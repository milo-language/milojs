name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned to a PATCH version, not "latest" and not a floating major. node IS
      # the oracle here — every .expected is its byte-exact output — so the node
      # version is part of the contract, and a runner image bumping its default
      # would rewrite that contract silently. util.inspect layout and error text
      # move between majors.
      #
      # The major alone ('25') is not enough: src/engine/unicase.milo is generated from
      # node's bundled ICU, so a PATCH bump that ships new Unicode data makes
      # `gen-unicase --check` fail with no code change. That is what 25.9.0 did
      # to a table generated on 25.3.0.
      #
      # Bumping this line is a deliberate act: re-run tools/verify-expected.sh
      # --update and node tools/gen-unicase.mjs > src/engine/unicase.milo, and read both
      # diffs. It is the only place the oracle changes.
      - uses: actions/setup-node@v4
        with:
          node-version: '25.3.0'

      # milo needs clang 16+ for the element-type-free intrinsic mangling
      # (@llvm.memcpy.p0.p0.i64); ubuntu-latest's default is older.
      - name: install clang 18
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          # milo probes /usr/bin/clang FIRST, so the symlink has to move.
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      # The runtime's fetch/TLS path links OpenSSL.
      - name: install openssl and sqlite headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev

      # Test against the released compiler, the same one users have. A milo
      # change that breaks milojs shows up here on the next run, not silently.
      - name: install milo
        run: |
          curl -fsSL -o milo.tar.gz \
            https://github.com/milo-language/milo/releases/download/latest/milo-linux-x64.tar.gz
          # The release tarball wraps the binary in a milo-<platform>/ directory;
          # strip it so `milo` lands in $PWD regardless of the asset name.
          tar xzf milo.tar.gz --strip-components=1
          chmod +x milo
          echo "$PWD" >> "$GITHUB_PATH"

      # docs/api is generated by `milo doc` and agents grep it and trust it, so a
      # stale copy is worse than none. The pre-commit hook regenerates and stages
      # it, but core.hooksPath is opt-in — a clone without the hook ships stale
      # generated docs and nothing notices. This is the gate for that case.
      - name: README stays within its prose budget
        run: node tools/check-readme.mjs

      - name: docs/api is not stale
        run: |
          ./tools/gen-docs.sh
          git diff --exit-code docs/api

      # Milo shares one program-wide namespace for top-level names and accepts a
      # duplicate definition silently (last one wins). This repo shipped
      # propertyBagOf twice with different bodies before anyone noticed, so the
      # check is a gate, not advisory. Runs before the build: it is instant, and
      # a duplicate makes everything after it untrustworthy.
      - name: lint symbols
        run: ./tools/lint-symbols.sh

      # src/engine/ is the ECMAScript language and src/runtime/ the host
      # bindings. Without a gate that is a directory layout, not an invariant:
      # the edges that already cross it (the evaluator's dispatch switch reaching
      # host.milo and napi.milo) would have been joined by more, silently. Every
      # crossing is registered in src/.layering-exempt with an argument, and a
      # registered crossing that no longer exists fails too.
      - name: engine does not reach the runtime
        run: ./tools/check-layering.sh

      # z3 discharges the nonlinear/bitwise contracts the native std/smt prover can only
      # mark unknown. Without it the gate still runs, just with weaker verdicts.
      - name: install z3
        run: sudo apt-get install -y z3

      # Static contract gate. Fails on a refuted contract, and on a contract that quietly
      # stopped being proven — see the header of the script for why those are separate.
      - name: verify contracts
        run: ./tools/verify-contracts.sh

      # The three built-in `length` tables in src/engine/eval.milo were marked
      # "GENERATED from node" with no generator committed, so nothing could tell
      # whether 389 hand-transcribed integers still matched. test262 has a
      # length.js per method, which makes each wrong one a silent conformance
      # failure that reads as an unrelated gap.
      - name: built-in lengths match node
        run: node tools/check-arity.mjs

      # src/engine/unicase.milo is generated from node's ICU. Its header says "do not
      # edit by hand"; this is what makes that true, and it also catches a node
      # upgrade silently changing what the engine believes about case mapping.
      - name: generated sources match their generators
        run: node tools/gen-unicase.mjs --check

      # src/engine/uniprops.txt (RegExp \p{...}) is generated from the same ICU, but its
      # property SPELLINGS are harvested from the test262 corpus, which CI does
      # not check out. Verifying the stamp is the half that needs no corpus: it
      # catches the node upgrade, which is the drift that actually happens.
      - name: unicode property tables carry the ICU they came from
        run: |
          stamp="node $(node -p 'process.versions.node') (ICU $(node -p 'process.versions.icu'), Unicode $(node -p 'process.versions.unicode'))"
          grep -qF "Generated from $stamp." src/engine/uniprops.txt || {
            echo "src/engine/uniprops.txt was generated by a different node than this job runs."
            echo "  expected: $stamp"
            grep -m1 '^# Unicode property tables' -A0 src/engine/uniprops.txt
            sed -n '2p' src/engine/uniprops.txt
            echo "Regenerate with: TEST262=<corpus> node tools/gen-uniprops.mjs"
            exit 1
          }

      # "Keep the docs current" was a request in AGENTS.md, and requests are not
      # gates. This checks the parts a machine can: every doc has a doc-meta
      # block, its key-files exist, the AGENTS tables name everything on disk,
      # and no doc silently went stale against the code it describes.
      - name: docs are in step with the tree
        run: node tools/check-docs.mjs

      # Line counts, fixture counts and the Node-API entry-point count are
      # compiled into README/AGENTS/docs from the tree. README, AGENTS.md and
      # status.md each carried a DIFFERENT line count for the same tree before
      # this existed. The hook recompiles and stages; this catches a commit made
      # without the hook installed.
      - name: prose facts match the tree
        run: node tools/gen-facts.mjs --check

      # The other half of the differential contract. tests/run.sh proves milojs
      # matches the .expected files; this proves the .expected files are what
      # node actually prints. Without it "node is the oracle" is honor-system,
      # and a hand-written .expected locks in the engine's own bug as the
      # contract. Runs before the build on purpose: it needs no binaries, so a
      # bad .expected fails in seconds instead of after a full LLVM build.
      - name: verify .expected came from node
        run: ./tools/verify-expected.sh

      # Built once and reused: run.sh compiles per-pass otherwise, and an LLVM
      # build per fixture dwarfs the test time.
      - name: build engine and runtime
        run: |
          milo build src/milojs-engine.milo -o /tmp/milojs-engine
          milo build src/milojs.milo -o /tmp/milojs

      # Every gate above answers "is the tree clean". None of them answers "would
      # this gate still say no". This repo has shipped three gates that had
      # stopped checking anything and stayed green for months: check-arity
      # printing "0 checked", check-gaps dropping two of six probes, and
      # quickjs-sweep scoring 0/149 off a binary that did not exist. This one
      # introduces each gate's own violation and requires it to fail. It needs a
      # clean tree, so it runs here rather than in the pre-commit hook, and it
      # restores every file it touches before moving on.
      - name: the gates still have teeth
        run: ./tools/check-gate-teeth.sh

      # tests/*.js on the engine, tests/runtime/*.js on the runtime. The runtime
      # pass is the guard on the async / fetch / event-loop machinery — it used
      # to run out of the milo repo (tests/milojsRuntime.test.ts) and moved here
      # with the source.
      - name: js fixtures
        run: MILOJS_ENGINE_BIN=/tmp/milojs-engine MILOJS_RUNTIME_BIN=/tmp/milojs ./tests/run.sh

      # The README's examples, run against the binaries just built. A doc that
      # promises output the engine no longer produces fails here instead of in
      # front of whoever followed the README.
      - name: docs examples
        run: MILOJS_ENGINE_BIN=/tmp/milojs-engine MILOJS_RUNTIME_BIN=/tmp/milojs node tools/check-docs-exec.mjs

      # tools/dev.sh runs this locally but CI never did, leaving the PTY/raw-mode
      # path — the one place a zero-byte VTIME read gets mistaken for EOF —
      # unguarded on every push. run-repl.sh skips itself if script(1) is absent.
      - name: repl pty
        run: MILOJS_RUNTIME_BIN=/tmp/milojs ./tests/run-repl.sh

      # tests/milo/*.milo — milojs invariants asserted from Milo directly
      # (async park/resume, exec-context identity, GC roots under a parked
      # activation), also inherited from the milo repo's fixture suite.
      - name: milo fixtures
        run: ./tests/run-milo.sh

      - name: Node-API addon callback
        run: MILOJS_RUNTIME_BIN=/tmp/milojs ./tests/run-napi.sh

  # The embedding story (build-lib -> libmilojs.a/.h -> compile & run the C
  # example) is the one path users hit on both platforms, so it gets its own
  # cross-OS matrix instead of riding the Linux-only test job. run-embed.sh
  # already selects the right link libs and OpenSSL paths per uname.
  embed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            milo_asset: milo-linux-x64
          - os: macos-latest
            milo_asset: milo-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install clang 18 (linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      - name: install openssl and sqlite headers (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev

      # Preinstalled on the runner image, but keep it explicit so the keg prefix
      # run-embed.sh points -I/-L at is guaranteed present.
      - name: install openssl (macos)
        if: runner.os == 'macOS'
        run: brew install openssl@3 || true

      - name: install milo
        run: |
          curl -fsSL -o milo.tar.gz \
            https://github.com/milo-language/milo/releases/download/latest/${{ matrix.milo_asset }}.tar.gz
          # The release tarball wraps the binary in a milo-<platform>/ directory;
          # strip it so `milo` lands in $PWD regardless of the asset name.
          tar xzf milo.tar.gz --strip-components=1
          chmod +x milo
          echo "$PWD" >> "$GITHUB_PATH"

      - name: embedding C ABI
        run: ./tests/run-embed.sh
